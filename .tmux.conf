set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

#transparant
set-window-option -g window-active-style bg=terminal
set-window-option -g window-style bg=terminal

#### Key bindings
set-window-option -g mode-keys vi

# Moving window
bind-key -n M-S-Left swap-window -t -1 \; previous-window
bind-key -n M-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

bind -r C-m resize-pane -Z

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R


set -g mouse on
set -sg escape-time 10
set-window-option -g mode-keys vi

# bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
# bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard -i"


unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# pane border
set-option -g pane-border-style fg=#0d0d0d #base02
set-option -g pane-active-border-style fg=#333333,bg=default

set -g status-style fg=colour241,bg=default

# M-b is not acceptable as prefix -- Vim uses it
unbind M-b
set -g prefix  C-a
bind C-a send-prefix

# Easy bindings for split
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r i run-shell "tmux neww tmux-cht.sh"
bind-key R source-file ~/.tmux.conf \; display-message "   Config successfully reloaded!"


set-option -g status-position bottom
set-option -g status-style bg=terminal,fg=white
set-option -g automatic-rename on
set-option -g status-left-length 20
set-option -g status-left '#[fg=#ff0000]#(echo "Session: ")#[fg=#ff6700]#{session_name}'
set-option -g status-justify centre
set-option -g status-right '#{?pane_at_top,top,bot}'
set-option -g status-interval 1
set-option -g window-status-format '#{window_index}#(echo ":")#{window_name}#{window_flags}'
set-option -g window-status-current-format '#[fg=#ff0000,bg=terminal]#{window_index}#(echo ":")#{window_name}#{window_flags}'



